name: Deploy Python Fireworks to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-web.txt

      - name: Test mobile controls and animation
        run: python -m unittest discover -s tests -v

      - name: Build WebAssembly version
        run: python -m pygbag --build --ume_block 0 --title "Python Fireworks" .

      - name: Install browser test tools
        run: |
          python -m pip install "playwright>=1.50,<2"
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi

      - name: Smoke test packaged mobile site
        timeout-minutes: 5
        run: python .github/scripts/browser_smoke.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
